# Categories of the release notes generated by GitHub (release workflow, docs/dev-environment.md#5-release-on-github),
# from the labels of the pull requests merged since the previous release
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Changes
      labels: ["*"]
