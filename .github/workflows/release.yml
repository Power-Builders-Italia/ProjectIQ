name: release

# Publishes a GitHub release of ProjectIQ from a deploy-test run: the release carries exactly the managed
# OpenProject365 and OpenProject365SupplierPortal zips that were imported and tested in Test (Test itself cannot export
# them: they are managed there), with their SHA-256 checksums. Version and tag come from the run: deploy-test gives both
# solutions 1.0.<run number>.0, the release is tagged v1.0.<run number> on the commit of main that run deployed.
# Release notes are generated by GitHub from the pull requests merged since the previous release, grouped by label
# (.github/release.yml). By default the release is created as a draft: review the notes, then publish it.
# Runs in the GitHub environment release (required reviewer, deployment branches: main); it needs no secrets.
on:
  workflow_dispatch:
    inputs:
      deploy-test-run:
        description: Run id of the deploy-test run tested in Test (the number in its URL .../actions/runs/<id>)
        required: true
      draft:
        description: Create the release as a draft (publish it after reviewing the notes)
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # to create the tag and the release
      contents: write
      # to read the deploy-test run and download its artifact
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the deploy-test run
        # Only a successful deploy-test run from main counts: its managed zips are what Test received
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.deploy-test-run }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then echo "::error::deploy-test-run '$RUN_ID': use the numeric run id"; exit 1; fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID") || { echo "::error::run $RUN_ID not found"; exit 1; }
          path=$(jq -r .path <<< "$run"); branch=$(jq -r .head_branch <<< "$run"); conclusion=$(jq -r .conclusion <<< "$run")
          if [ "$path" != .github/workflows/deploy-test.yml ]; then echo "::error::run $RUN_ID is $path, not deploy-test"; exit 1; fi
          if [ "$branch" != main ]; then echo "::error::run $RUN_ID ran on $branch, not main"; exit 1; fi
          if [ "$conclusion" != success ]; then echo "::error::run $RUN_ID ended with '$conclusion'"; exit 1; fi
          number=$(jq -r .run_number <<< "$run")
          tag="v1.0.$number"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1 \
             || gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::release $tag already exists"; exit 1
          fi
          {
            echo "version=1.0.$number.0"
            echo "tag=$tag"
            echo "sha=$(jq -r .head_sha <<< "$run")"
            echo "url=$(jq -r .html_url <<< "$run")"
          } >> "$GITHUB_OUTPUT"
      - name: Download the managed solutions of the deploy-test run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenProject365-managed
          path: out/solutions
          run-id: ${{ inputs.deploy-test-run }}
          github-token: ${{ github.token }}
      - name: Check the packages
        # Both zips must be there, managed, with the version of the run (same check as the AppSource package)
        env:
          VERSION: ${{ steps.run.outputs.version }}
        run: |
          python3 -c 'import sys; sys.path.insert(0, "tools/alm"); from pathlib import Path
          from build_appsource_package import check_solutions; check_solutions(Path(sys.argv[1]), sys.argv[2])' \
            out/solutions "$VERSION"
      - name: Checksums
        working-directory: out/solutions
        run: sha256sum *_managed.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.run.outputs.tag }}
          VERSION: ${{ steps.run.outputs.version }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ steps.run.outputs.url }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$SHA" \
            --jq .body > out/generated.md
          {
            echo "Managed solutions \`$VERSION\`, the ones imported and tested in Test by [deploy-test]($RUN_URL) (commit \`${SHA::7}\`)."
            echo
            echo "Install in this order: \`OpenProject365_managed.zip\`, then \`OpenProject365SupplierPortal_managed.zip\` (see the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/dev-environment.md#5-release-on-github))."
            echo
            cat out/generated.md
          } > out/notes.md
          flags=()
          [ "$DRAFT" = true ] && flags+=(--draft)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" out/solutions/*_managed.zip out/solutions/SHA256SUMS.txt \
            --target "$SHA" --title "ProjectIQ $VERSION" --notes-file out/notes.md "${flags[@]}"
          echo "### Release $TAG ($VERSION): [Releases](https://github.com/$GITHUB_REPOSITORY/releases)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRAFT" = true ]; then
            echo "Created as a **draft**: review the notes, then **Publish release** (the tag is created then)." >> "$GITHUB_STEP_SUMMARY"
          fi
