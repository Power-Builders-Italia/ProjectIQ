name: deploy-test

# Exports OpenProject365 and then OpenProject365SupplierPortal as managed from Dev (version 1.0.<run>.0)
# and imports them into Test in that order (the portal uses the main solution's tables).
# First it exports both unmanaged and compares them with main (tools/alm/compare_solution.py): if Dev holds changes
# that are not in main, or main changes not yet installed by deploy-dev, nothing is deployed.
# Uses the PP_* secrets; the app registration must be an application user in both environments.
# Connection references are mapped by deployment/<settings>.settings.json (connections stay out of the managed layer);
# its #{NAME}# tokens come from the secrets of the GitHub environment <settings> (secrets, not variables: the
# Actions logs of a public repository are public and only secrets are masked).
on:
  workflow_dispatch:
    # No target URL input: the target is always the TEST_ENVIRONMENT_URL secret of the chosen GitHub environment,
    # so whoever can run the workflow cannot point the app registration at another environment
    inputs:
      settings:
        description: Deployment settings file in deployment/ (without .settings.json); also the GitHub environment name
        default: test
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest
    # GitHub environment: protection rules (required reviewers, main only) and environment-scoped secrets (PP_* included)
    environment: ${{ inputs.settings }}
    env:
      TARGET_URL: ${{ secrets.TEST_ENVIRONMENT_URL }}
      OP365_DATAVERSE_CONNECTION_ID: ${{ secrets.OP365_DATAVERSE_CONNECTION_ID }}
      OP365_TIME_APPROVAL_ENABLED: ${{ secrets.OP365_TIME_APPROVAL_ENABLED }}
      OP365_PURCHASE_REQUEST_THRESHOLD: ${{ secrets.OP365_PURCHASE_REQUEST_THRESHOLD }}
      OP365_PURCHASING_APPROVER: ${{ secrets.OP365_PURCHASING_APPROVER }}
      OP365_SUPPLIER_EMAIL_SENDER: ${{ secrets.OP365_SUPPLIER_EMAIL_SENDER }}
      OP365_SHAREPOINT_CONNECTION_ID: ${{ secrets.OP365_SHAREPOINT_CONNECTION_ID }}
      OP365_SHAREPOINT_SITE_URL: ${{ secrets.OP365_SHAREPOINT_SITE_URL }}
      OP365_PROJECT_LIBRARY_ID: ${{ secrets.OP365_PROJECT_LIBRARY_ID }}
      OP365_PURCHASE_ORDER_LIBRARY_ID: ${{ secrets.OP365_PURCHASE_ORDER_LIBRARY_ID }}
      OP365_SUPPLIER_DOCUMENT_LIBRARY_ID: ${{ secrets.OP365_SUPPLIER_DOCUMENT_LIBRARY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve target and deployment settings
        # #{NAME}# tokens in the settings file are replaced with the secret NAME, so ids stay out of the repo;
        # Power Platform environment variables left empty are dropped, so the target keeps its current value (or the default)
        shell: pwsh
        run: |
          if (-not $env:TARGET_URL) { throw 'Set the TEST_ENVIRONMENT_URL secret of the GitHub environment ${{ inputs.settings }}' }
          $text = Get-Content 'deployment/${{ inputs.settings }}.settings.json' -Raw
          $text = [regex]::Replace($text, '#\{(\w+)\}#', { param($m) [Environment]::GetEnvironmentVariable($m.Groups[1].Value) })
          $settings = $text | ConvertFrom-Json
          $missing = @($settings.ConnectionReferences | Where-Object { -not $_.ConnectionId } | ForEach-Object { $_.LogicalName })
          if ($missing) { throw "No connection for $($missing -join ', '): set the OP365_*_CONNECTION_ID secrets (see docs/dev-environment.md)" }
          $settings.EnvironmentVariables = @($settings.EnvironmentVariables | Where-Object { $_.Value })
          New-Item -ItemType Directory -Force out | Out-Null
          Set-Content out/deployment.settings.json ($settings | ConvertTo-Json -Depth 5)
      - uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Dev must match main: Test gets only what was merged and installed in Dev by deploy-dev
      - name: Export Dev (unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: OpenProject365
          solution-output-file: out/dev/OpenProject365.zip
          managed: false
      - name: Export Dev portal (unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: OpenProject365SupplierPortal
          solution-output-file: out/dev/OpenProject365SupplierPortal.zip
          managed: false
      - name: Unpack Dev
        uses: microsoft/powerplatform-actions/unpack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          solution-file: out/dev/OpenProject365.zip
          solution-folder: dev/solutions/OpenProject365/src
          solution-type: Unmanaged
      - name: Unpack Dev portal
        uses: microsoft/powerplatform-actions/unpack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          solution-file: out/dev/OpenProject365SupplierPortal.zip
          solution-folder: dev/solutions/OpenProject365SupplierPortal/src
          solution-type: Unmanaged
      - name: Compare Dev with main
        shell: bash
        env:
          # the exports hold labels in every language: never let Python fall back to the cp1252 console encoding
          PYTHONUTF8: 1
        run: |
          echo "#### Dev compared with main (\`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
          set +e
          python tools/alm/compare_solution.py solutions dev/solutions --summary summary.md > /dev/null
          code=$?
          set -e
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) ;;
            1) echo "::error::Dev does not match main: run deploy-dev (it opens a drift pull request if Dev has changes not in main), then deploy again"; exit 1 ;;
            *) echo "::error::The comparison could not run (exit $code)"; exit 1 ;;
          esac
      - name: Set solution version in Dev
        uses: microsoft/powerplatform-actions/set-online-solution-version@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          name: OpenProject365
          version: 1.0.${{ github.run_number }}.0
      - name: Export managed from Dev
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: OpenProject365
          solution-output-file: out/OpenProject365_managed.zip
          managed: true
      - name: Import into target
        uses: microsoft/powerplatform-actions/import-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.TARGET_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/OpenProject365_managed.zip
          publish-changes: true
          # upgrade: components removed from the solution (e.g. the former op365_settings table) are deleted in the target
          stage-and-upgrade: true
          # plugin steps are imported disabled unless activated
          activate-plugins: true
          run-asynchronously: true
          max-async-wait-time: 60
          use-deployment-settings-file: true
          deployment-settings-file: out/deployment.settings.json
      - name: Set portal solution version in Dev
        uses: microsoft/powerplatform-actions/set-online-solution-version@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          name: OpenProject365SupplierPortal
          version: 1.0.${{ github.run_number }}.0
      - name: Export portal managed from Dev
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: OpenProject365SupplierPortal
          solution-output-file: out/OpenProject365SupplierPortal_managed.zip
          managed: true
      - name: Import portal into target
        uses: microsoft/powerplatform-actions/import-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ env.TARGET_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/OpenProject365SupplierPortal_managed.zip
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
      - name: Upload managed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenProject365-managed
          path: out/*_managed.zip
