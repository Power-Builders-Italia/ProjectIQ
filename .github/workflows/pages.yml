name: pages

# Documentation website on GitHub Pages, built from README.md and docs/ (mkdocs.yml).
# Pull requests only build it (--strict fails on broken links); a push to main publishes it.
on:
  pull_request:
    paths: [README.md, 'docs/**', mkdocs.yml, 'tools/docs/**', .github/workflows/pages.yml]
  push:
    branches: [main]
    paths: [README.md, 'docs/**', mkdocs.yml, 'tools/docs/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - name: Build site
        run: |
          pip install -r tools/docs/requirements.txt
          python3 tools/docs/build_site.py
          mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
