name: pages

# Documentation website on GitHub Pages, built from README.md and docs/ (mkdocs.yml).
# Pull requests only build it (--strict fails on broken links); a push to main publishes it.
on:
  pull_request:
    paths: [README.md, 'docs/**', mkdocs.yml, 'tools/docs/**', .github/workflows/pages.yml]
  push:
    branches: [main]
    paths: [README.md, 'docs/**', mkdocs.yml, 'tools/docs/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - name: Build site
        run: |
          pip install -r tools/docs/requirements.txt
          python3 tools/docs/build_site.py
          mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
