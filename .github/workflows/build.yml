name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: User manuals consistency
        run: python3 tools/docs/check_docs.py

  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Plugins build and tests
        run: |
          dotnet build src/plugins/OpenProject365.Plugins -c Release
          dotnet test src/plugins/OpenProject365.Plugins.Tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/pcf/package-lock.json
      - name: PCF lint, tests and build
        working-directory: src/pcf
        run: |
          npm ci
          npm test
          npm run build -- --buildMode production

  solution:
    runs-on: windows-latest
    env:
      # Solution Checker runs only when the service principal secrets are configured
      HAS_CHECKER: ${{ secrets.PP_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
      - name: Pack solution (unmanaged)
        if: hashFiles('solutions/OpenProject365/src/Other/Solution.xml') != ''
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          solution-folder: solutions/OpenProject365/src
          solution-file: out/OpenProject365.zip
          solution-type: Unmanaged
      - name: Pack portal solution (unmanaged)
        if: hashFiles('solutions/OpenProject365SupplierPortal/src/Other/Solution.xml') != ''
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          solution-folder: solutions/OpenProject365SupplierPortal/src
          solution-file: out/OpenProject365SupplierPortal.zip
          solution-type: Unmanaged
      - name: Solution Checker
        if: env.HAS_CHECKER == 'true' && hashFiles('out/OpenProject365.zip') != ''
        uses: microsoft/powerplatform-actions/check-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          path: out/OpenProject365.zip
          checker-logs-artifact-name: solution-checker-logs
      - name: Solution Checker findings
        if: env.HAS_CHECKER == 'true' && hashFiles('out/OpenProject365.zip') != ''
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'PowerAppsChecker'
          Get-ChildItem $out -Recurse -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath (Join-Path $out 'sarif') -Force }
          $sarif = Get-ChildItem $out -Recurse -Filter *.sarif
          foreach ($file in $sarif) {
            $doc = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($run in $doc.runs) {
              foreach ($r in $run.results) {
                $loc = ($r.locations | ForEach-Object { $_.physicalLocation.artifactLocation.uri + ' ' + $_.logicalLocations.fullyQualifiedName }) -join '; '
                Write-Output ("[{0}] {1}: {2} @ {3}" -f $r.properties.severity, $r.ruleId, $r.message.text, $loc)
              }
            }
          }
      - name: Upload solution package
        if: hashFiles('out/OpenProject365.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenProject365-unmanaged
          path: out/*.zip
