name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  solution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/powerplatform-actions/actions-install@v1
      - name: Pack solution (unmanaged)
        if: hashFiles('solutions/OpenProject365/src/Other/Solution.xml') != ''
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/OpenProject365/src
          solution-file: out/OpenProject365.zip
          solution-type: Unmanaged
      - name: Upload solution package
        if: hashFiles('out/OpenProject365.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenProject365-unmanaged
          path: out/OpenProject365.zip
